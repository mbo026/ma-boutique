<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>document</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <main class="login-box">
    <h1>Boutique de Hami & Jérémy</h1>
    <p>Connecte-toi pour accéder à la boutique.</p>

    <form action="boutique_simple.html" method="get">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" placeholder="Ton pseudo" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" placeholder="Ton mot de passe" required>

      <button type="submit">Login</button>
    </form>
  </main>
</body>
</html>
